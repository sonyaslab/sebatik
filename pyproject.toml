[project]
name = "sebatik"
version = "1.0.0"
description = "Dasbor pemantauan ketersediaan dan capaian data indikator ISV-IUP BPS Provinsi Kalimantan Utara"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv-sebatik", ".runtime-packages", "frontend", "data", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# Gaya ringkas satu baris masih dipakai di modul lama yang belum dipindahkan;
# aturan yang menentangnya dinyalakan bertahap seiring modul di-refactor.
ignore = ["E501", "E701", "E702", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"backend/alembic/versions/*" = ["E402", "I001"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Pengetatan bertahap: modul baru (config, models, repositories, services)
# ditegakkan lebih ketat lewat blok override di bawah.
check_untyped_defs = false
warn_unused_ignores = true
exclude = "(^\\.venv-sebatik|^\\.runtime-packages|^frontend|^backend/alembic/versions)"

[[tool.mypy.overrides]]
module = ["backend.app.config", "backend.app.models.*", "backend.app.db.*"]
check_untyped_defs = true
disallow_untyped_defs = true

# Modul lama belum ber-anotasi. Masing-masing keluar dari daftar ini ketika fase
# yang menulis ulangnya selesai (lihat docs/refactoring/peta-jalan.md).
[[tool.mypy.overrides]]
module = ["src.etl.audit"]        # laporan audit; anotasi menyusul
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
# `src` diimpor sebagai paket (src.etl...) dari backend dan tes; tanpa ini
# pytest hanya menaruh direktori tes di sys.path, bukan akar proyek.
pythonpath = ["."]

[tool.ruff.format]
# Modul lama masih memakai gaya satu-baris padat. Memformat ulang sekarang akan
# menghasilkan diff raksasa yang menenggelamkan diff refactoring itu sendiri;
# tiap berkas dikeluarkan dari daftar ini ketika fase yang menulis ulangnya
# selesai (lihat docs/refactoring/peta-jalan.md).
exclude = [
    "src/etl/audit.py",
    "scripts/generate_system_diagrams.py",
    "scripts/seed_master_dashboard.py",
    "tools/*.py",
    # Dokumentasi dan rencana perbaikan memuat cuplikan Python sebagai ilustrasi.
    # Cuplikan itu memang dipotong seperlunya; memformatnya justru mengubah
    # dokumen yang sudah selesai ditulis.
    "docs/**",
    "plans/**",
]
