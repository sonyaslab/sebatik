# Konfigurasi Alembic SEBATIK.
# URL basis data TIDAK ditulis di sini: env.py membacanya dari
# backend/app/config.py (SEBATIK_DATABASE_URL), sehingga hanya ada satu sumber.

[alembic]
script_location = %(here)s/alembic
# Dijalankan dari akar repositori agar paket `backend` dan `src` dapat diimpor.
prepend_sys_path = ..
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
