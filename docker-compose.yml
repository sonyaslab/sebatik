services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sebatik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
      POSTGRES_DB: sebatik
    volumes:
      - sebatik_pgdata:/var/lib/postgresql/data
    # Hanya dibuka ke mesin lokal agar Alembic dan skrip pemindahan yang
    # dijalankan dari host dapat menjangkau PostgreSQL tanpa mengeksposnya ke LAN.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sebatik"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Migrasi skema dijalankan sebagai langkah deploy tersendiri, bukan saat
  # aplikasi mengimpor modul. Layanan ini keluar setelah selesai.
  migrasi:
    build: .
    env_file:
      - .env
    command: ["python", "-m", "alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  sebatik:
    build: .
    restart: unless-stopped
    # Terikat ke localhost: proxy Coolify menjangkau container lewat jaringan
    # internal Docker, dan binding localhost mencegah akses langsung yang
    # melewati proxy (dan bisa memalsukan X-Forwarded-For). Ganti/hapus bila
    # Coolify Anda dikonfigurasi mengharuskan port publik.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - sebatik_data:/app/data/processed
      - sebatik_backup:/app/backup
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      migrasi:
        condition: service_completed_successfully

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
    # pg_dump harian dengan retensi 30 berkas, menggantikan salinan berkas SQLite.
    command: >
      sh -c 'while true; do
        pg_dump -h db -U sebatik -d sebatik -Fc -f /backup/sebatik-$$(date +%Y%m%d-%H%M%S).dump &&
        ls -1t /backup/sebatik-*.dump | tail -n +31 | xargs -r rm --;
        sleep 86400;
      done'
    volumes:
      - sebatik_backup:/backup
    depends_on:
      db:
        condition: service_healthy

volumes:
  sebatik_pgdata:
  sebatik_data:
  sebatik_backup:
