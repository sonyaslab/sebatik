name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sebatik
          POSTGRES_PASSWORD: sebatik
          POSTGRES_DB: sebatik_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sebatik"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy backend src
      - name: Migrasi basis data uji
        run: python -m alembic -c backend/alembic.ini upgrade head
        env:
          SEBATIK_DATABASE_URL: postgresql+psycopg://sebatik:sebatik@localhost:5432/sebatik_test
      - name: Uji migrasi dapat dibatalkan
        run: python -m alembic -c backend/alembic.ini downgrade base
        env:
          SEBATIK_DATABASE_URL: postgresql+psycopg://sebatik:sebatik@localhost:5432/sebatik_test
      - name: Test
        # Ambang cakupan mengikuti target testing-ci.md §7 (>= 80%).
        run: pytest --cov=backend/app --cov=src --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 menuntut Node >= 22.22; samakan dengan mesin pengembangan.
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # Lockfile bekuku: resolasi versi yang sudah teruji tidak diganti runner.
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
